<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реестр уголовных дел</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --text: #2c2416;
      --text-secondary: #6b5e4a;
      --accent: #1a7f6e;
      --accent-hover: #156658;
      --danger: #b91c1c;
      --warning: #d97706;
      --border: #e4d9c5;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --radius: 12px;
      --transition: 0.2s ease;
    }
    [data-theme="dark"] {
      --bg: #1c1a15;
      --surface: #2a2720;
      --text: #ede6d5;
      --text-secondary: #b7a68e;
      --accent: #2aa18b;
      --accent-hover: #218b77;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #4a4235;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Satoshi', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 300px; background: var(--surface); border-right: 1px solid var(--border);
      padding: 20px; display: flex; flex-direction: column; gap: 24px;
    }
    .main { flex: 1; padding: 28px 32px; overflow-x: auto; }
    button, .btn {
      background: var(--accent); color: #fff; border: none; padding: 10px 18px;
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
      transition: background var(--transition);
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button.danger { background: var(--danger); }
    input, select, textarea {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text); font-family: inherit; font-size: 0.9rem;
      margin-bottom: 12px; transition: border var(--transition);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; gap: 16px; }
    .stat-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .stat-value { font-size: 1.8rem; font-weight: 900; }
    .stat-label { color: var(--text-secondary); font-size: 0.8rem; }
    .chip { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; background: rgba(26,127,110,0.1); color: var(--accent); }
    .urgent { background: rgba(185,28,28,0.1); color: var(--danger); }
    .warning-chip { background: rgba(217,119,6,0.1); color: var(--warning); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-secondary); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
    tr:hover td { background: rgba(0,0,0,0.02); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
    }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tab {
      padding: 10px 24px; cursor: pointer; font-weight: 600; color: var(--text-secondary);
      border-bottom: 2px solid transparent; transition: all var(--transition);
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .notification-count { background: var(--danger); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
    @media (max-width: 1024px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="flex" style="justify-content: space-between;">
        <h2 style="font-weight: 900;">Реестр дел</h2>
        <button id="themeToggle" class="secondary" style="padding: 6px 12px;">☀/☾</button>
      </div>
      <div class="grid stat-grid" id="stats"></div>
      
      <div id="urgentNotifications" class="card" style="padding:12px;">
        <h3 style="margin-bottom: 8px;">🚨 Продление сроков</h3>
        <div id="prolongationAlerts"></div>
      </div>

      <div id="urgentCasesSidebar" class="card" style="padding:12px;">
        <h3 style="margin-bottom: 8px;">⏳ Срочные дела (мера ≤7 дн)</h3>
        <div id="urgentCasesList"></div>
      </div>

      <div style="margin-top: auto; display: flex; gap: 8px; flex-direction: column;">
        <button id="refreshBtn" class="secondary">↻ Обновить</button>
        <button id="loginBtn">Войти как админ</button>
        <button id="addCaseBtn" style="display: none;">+ Добавить дело</button>
        <span id="userStatus" style="font-size:0.8rem; color: var(--text-secondary);"></span>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="tabs" id="mainTabs">
        <div class="tab active" data-tab="cases">Дела</div>
        <div class="tab" data-tab="archive">Архив</div>
        <div class="tab" data-tab="announcements">Объявления</div>
      </div>

      <!-- Панель дел -->
      <div id="tabCases" class="tab-content">
        <div class="flex" style="margin-bottom: 16px; gap:12px;">
          <input type="text" id="searchInput" placeholder="Поиск по всем полям..." style="max-width: 400px;">
          <select id="filterMeasure">
            <option value="">Все меры</option>
            <option value="стража">Стража</option>
            <option value="домашний арест">Домашний арест</option>
            <option value="подписка">Подписка</option>
            <option value="без меры">Без меры</option>
          </select>
          <select id="filterUrgency">
            <option value="">Все сроки</option>
            <option value="expired">Истёк</option>
            <option value="7">≤ 7 дней</option>
            <option value="14">≤ 14 дней</option>
            <option value="30">≤ 30 дней</option>
          </select>
          <button id="clearFilters" class="secondary">Сброс</button>
        </div>
        <div id="casesTableContainer" style="overflow-x: auto;"></div>
      </div>

      <!-- Панель архива -->
      <div id="tabArchive" class="tab-content" style="display: none;">
        <div class="flex" style="margin-bottom: 16px;">
          <input type="text" id="archiveSearchInput" placeholder="Поиск по архиву..." style="max-width: 400px;">
        </div>
        <div id="archiveTableContainer" style="overflow-x: auto;"></div>
      </div>

      <!-- Панель объявлений -->
      <div id="tabAnnouncements" class="tab-content" style="display: none;">
        <div class="flex" style="justify-content: space-between; margin-bottom: 16px;">
          <h2>Объявления и графики</h2>
          <button id="addAnnouncementBtn" style="display: none;">+ Добавить объявление</button>
        </div>
        <div id="announcementsList"></div>
      </div>
    </main>
  </div>

  <!-- Модалки -->
  <div id="caseModal" class="card" style="position: fixed; top: 5%; left: 5%; right: 5%; bottom: 5%; z-index: 1000; overflow-y: auto; display: none;"></div>
  <div id="announcementModal" class="card" style="position: fixed; top: 10%; left: 10%; right: 10%; max-height: 80%; z-index: 1000; overflow-y: auto; display: none;"></div>

  <script>
    // ---------- SUPABASE ----------
    const SUPABASE_URL = "https://qnqmpwmsqelmgkhyybxd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFucW1wd21zcWVsbWdraHl5YnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MzgxNTEsImV4cCI6MjA5NDExNDE1MX0.ADsYUmVfH7DjdM9Yc01tPvB4HVOmsl0FkckaQlL7t4o";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ---------- GLOBAL STATE ----------
    let currentUser = null;
    let casesData = [];
    let filteredCases = [];
    let activeTab = 'cases'; // cases, archive, announcements
    let editingCaseId = null;

    // ---------- UTILS ----------
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
    }

    function daysUntil(dateStr) {
      if (!dateStr) return Infinity;
      const now = new Date(); now.setHours(0,0,0,0);
      const target = new Date(dateStr);
      const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
      return diff;
    }

    function monthsUntil(dateStr) {
      if (!dateStr) return '';
      const now = new Date();
      const target = new Date(dateStr);
      let months = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
      if (target.getDate() < now.getDate()) months--;
      return months > 0 ? `${months} мес` : (months === 0 ? 'меньше месяца' : 'истёк');
    }

    // Проверка необходимости продления следствия
    function checkProlongation(c) {
      const invDate = c.investigation_until;
      if (!invDate) return null;
      const days = daysUntil(invDate);
      const measure = (c.measure || '').toLowerCase();
      const isStrict = measure.includes('страж') || measure.includes('домашний арест');
      const threshold = isStrict ? 15 : 10;
      if (days >= 0 && days <= threshold) {
        return { type: 'следствие', daysLeft: days, threshold };
      }
      return null;
    }

    function checkMeasureProlongation(c) {
      const expDate = c.measure_expiry;
      if (!expDate) return null;
      const days = daysUntil(expDate);
      if (days >= 0 && days <= 7) {
        return { type: 'мера', daysLeft: days };
      }
      return null;
    }

    function getUrgencyClass(c) {
      const days = daysUntil(c.measure_expiry);
      if (days < 0) return 'badge-red';
      if (days <= 7) return 'badge-red';
      if (days <= 14) return 'badge-yellow';
      return 'badge-green';
    }

    // ---------- AUTH ----------
    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;
      document.getElementById('loginBtn').textContent = user ? 'Выйти' : 'Войти как админ';
      document.getElementById('addCaseBtn').style.display = user ? 'inline-block' : 'none';
      document.getElementById('addAnnouncementBtn').style.display = user ? 'inline-block' : 'none';
      document.getElementById('userStatus').textContent = user ? `Вы: ${user.email}` : '';
      await loadCases();
      await loadAnnouncements();
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      if (currentUser) {
        await supabase.auth.signOut();
        currentUser = null;
        checkUser();
        return;
      }
      const email = prompt('Email:');
      const password = prompt('Пароль:');
      if (!email || !password) return;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert('Ошибка входа: ' + error.message);
      else checkUser();
    });

    // ---------- LOAD DATA ----------
    async function loadCases() {
      let query = supabase.from('cases').select('*');
      if (activeTab === 'cases') query = query.eq('archived', false);
      else if (activeTab === 'archive') query = query.eq('archived', true);
      const { data, error } = await query.order('created_at', { ascending: false });
      if (error) { console.error(error); return; }
      casesData = data || [];
      applyFilters();
      updateStatsAndUrgent();
    }

    function applyFilters() {
      const searchTerm = (document.getElementById(activeTab === 'archive' ? 'archiveSearchInput' : 'searchInput')?.value || '').toLowerCase();
      const measureFilter = document.getElementById('filterMeasure')?.value || '';
      const urgencyFilter = document.getElementById('filterUrgency')?.value || '';

      filteredCases = casesData.filter(c => {
        // search
        if (searchTerm) {
          const inFields = [c.case_number, c.fact, c.article, c.investigator, c.defendant, ...(c.tags||[])].join(' ').toLowerCase();
          if (!inFields.includes(searchTerm)) return false;
        }
        if (measureFilter && c.measure !== measureFilter) return false;
        if (urgencyFilter) {
          const days = daysUntil(c.measure_expiry);
          if (urgencyFilter === 'expired' && days >= 0) return false;
          if (urgencyFilter === '7' && (days < 0 || days > 7)) return false;
          if (urgencyFilter === '14' && (days < 0 || days > 14)) return false;
          if (urgencyFilter === '30' && (days < 0 || days > 30)) return false;
        }
        return true;
      });
      renderTable(activeTab === 'archive' ? 'archiveTableContainer' : 'casesTableContainer', filteredCases);
    }

    function renderTable(containerId, data) {
      const container = document.getElementById(containerId);
      if (data.length === 0) {
        container.innerHTML = '<p>Нет данных</p>';
        return;
      }
      let html = `<table><thead><tr>
        <th>№ дела</th><th>Обвиняемый</th><th>Факт</th><th>Статья</th><th>Мера</th><th>Срок меры</th>
        <th>Следствие до</th><th>Ост. время</th><th>Следователь</th><th>Теги</th><th>Действия</th>
      </tr></thead><tbody>`;
      data.forEach(c => {
        const invUntil = c.investigation_until ? formatDate(c.investigation_until) : '';
        const invDays = daysUntil(c.investigation_until);
        const invMonths = monthsUntil(c.investigation_until);
        const urgencyClass = getUrgencyClass(c);
        const prolongInv = checkProlongation(c);
        const prolongMeas = checkMeasureProlongation(c);
        const urgencyNote = [
          prolongInv ? `🔔 Продл. след.: ${prolongInv.daysLeft} дн.` : '',
          prolongMeas ? `⏰ Продл. меры: ${prolongMeas.daysLeft} дн.` : ''
        ].filter(Boolean).join('<br>');
        html += `<tr>
          <td><strong>${c.case_number || ''}</strong></td>
          <td>${c.defendant || ''}</td>
          <td>${c.fact || ''}</td>
          <td>${c.article || ''}</td>
          <td>${c.measure || ''}</td>
          <td><span class="badge ${urgencyClass}">${c.measure_expiry ? formatDate(c.measure_expiry) : ''}</span></td>
          <td>${invUntil}</td>
          <td>${invUntil ? `${invDays > 0 ? invDays + ' дн' : (invDays < 0 ? 'истёк' : 'сегодня')} / ${invMonths}` : ''}</td>
          <td>${c.investigator || ''}</td>
          <td>${(c.tags || []).map(t => `<span class="chip">${t}</span>`).join(' ')}</td>
          <td>${urgencyNote}<br>${currentUser ? `<button onclick="openEditModal('${c.id}')">Открыть</button>` : ''}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function updateStatsAndUrgent() {
      // stats for active cases only (non-archived) - используем casesData уже отфильтрованные по activeTab
      const activeCases = casesData.filter(c => !c.archived);
      document.getElementById('stats').innerHTML = `
        <div class="card"><div class="stat-value">${activeCases.length}</div><div class="stat-label">всего дел</div></div>
        <div class="card"><div class="stat-value">${activeCases.filter(c => (c.measure||'').includes('страж')||(c.measure||'').includes('дом')).length}</div><div class="stat-label">под стражей/дом.арест</div></div>
        <div class="card"><div class="stat-value">${activeCases.filter(c => daysUntil(c.measure_expiry)>=0 && daysUntil(c.measure_expiry)<=7).length}</div><div class="stat-label">срок ≤7 дн</div></div>
        <div class="card"><div class="stat-value">${new Set(activeCases.map(c=>c.investigator).filter(Boolean)).size}</div><div class="stat-label">следователей</div></div>
      `;

      // Urgent sidebar
      const urgent = activeCases.filter(c => daysUntil(c.measure_expiry)>=0 && daysUntil(c.measure_expiry)<=7);
      document.getElementById('urgentCasesList').innerHTML = urgent.length ? urgent.map(c => 
        `<div style="margin-bottom:6px;"><strong>${c.case_number}</strong> – ${c.defendant||c.fact||''} (${formatDate(c.measure_expiry)})</div>`
      ).join('') : '<div style="color: var(--text-secondary);">Нет срочных</div>';

      // Prolongation alerts
      const prolongAlerts = [];
      activeCases.forEach(c => {
        const inv = checkProlongation(c);
        const mes = checkMeasureProlongation(c);
        if (inv) prolongAlerts.push({case: c, ...inv});
        if (mes) prolongAlerts.push({case: c, ...mes});
      });
      const alertHtml = prolongAlerts.length ? prolongAlerts.map(a => 
        `<div style="margin-bottom:6px;"><span class="badge badge-red">!</span> <strong>${a.case.case_number}</strong> – ${a.type === 'следствие' ? 'Следствие' : 'Мера'} через ${a.daysLeft} дн.</div>`
      ).join('') : '<div style="color: var(--text-secondary);">Нет уведомлений</div>';
      document.getElementById('prolongationAlerts').innerHTML = alertHtml;

      // Notification count on tab maybe
      const totalAlerts = prolongAlerts.length;
      document.querySelector('.tab[data-tab="cases"]').innerHTML = `Дела ${totalAlerts ? `<span class="notification-count">${totalAlerts}</span>` : ''}`;
    }

    // ---------- MODAL FOR CASE ----------
    async function openEditModal(caseId) {
      if (!currentUser) return;
      const c = casesData.find(c => c.id === caseId) || {};
      editingCaseId = caseId;
      const modal = document.getElementById('caseModal');
      modal.style.display = 'block';
      modal.innerHTML = `
        <h2>${caseId ? 'Редактировать' : 'Новое'} дело</h2>
        <label>Номер дела</label><input id="editCaseNumber" value="${c.case_number || ''}">
        <label>Обвиняемый</label><input id="editDefendant" value="${c.defendant || ''}">
        <label>Факт</label><input id="editFact" value="${c.fact || ''}">
        <label>Статья</label><input id="editArticle" value="${c.article || ''}">
        <label>Мера пресечения</label>
        <select id="editMeasure">
          <option ${c.measure==='стража'?'selected':''}>стража</option>
          <option ${c.measure==='домашний арест'?'selected':''}>домашний арест</option>
          <option ${c.measure==='подписка'?'selected':''}>подписка</option>
          <option ${c.measure==='без меры'?'selected':''}>без меры</option>
        </select>
        <label>Дата истечения меры</label><input type="date" id="editMeasureExpiry" value="${c.measure_expiry || ''}">
        <label>Дата ВУД</label><input type="date" id="editDateInitiated" value="${c.date_initiated || ''}">
        <label>Срок следствия до</label><input type="date" id="editInvestigationUntil" value="${c.investigation_until || ''}">
        <label>Дата выхода на продление</label><input type="date" id="editExtensionDate" value="${c.extension_date || ''}">
        <label>Следователь</label><input id="editInvestigator" value="${c.investigator || ''}">
        <label>Теги (через запятую)</label><input id="editTags" value="${(c.tags || []).join(', ')}">
        <label>Примечание</label><textarea id="editNotes">${c.notes || ''}</textarea>
        <label><input type="checkbox" id="editArchived" ${c.archived ? 'checked' : ''}> Архивировать дело</label>
        <div class="flex" style="margin-top:16px; justify-content: flex-end;">
          <button class="secondary" onclick="document.getElementById('caseModal').style.display='none'">Отмена</button>
          <button class="danger" onclick="deleteCase('${caseId}')">Удалить</button>
          <button onclick="saveCase()">Сохранить</button>
        </div>
      `;
    }

    async function saveCase() {
      const data = {
        case_number: document.getElementById('editCaseNumber').value,
        defendant: document.getElementById('editDefendant').value,
        fact: document.getElementById('editFact').value,
        article: document.getElementById('editArticle').value,
        measure: document.getElementById('editMeasure').value,
        measure_expiry: document.getElementById('editMeasureExpiry').value || null,
        date_initiated: document.getElementById('editDateInitiated').value || null,
        investigation_until: document.getElementById('editInvestigationUntil').value || null,
        extension_date: document.getElementById('editExtensionDate').value || null,
        investigator: document.getElementById('editInvestigator').value,
        tags: document.getElementById('editTags').value.split(',').map(t => t.trim()).filter(Boolean),
        notes: document.getElementById('editNotes').value,
        archived: document.getElementById('editArchived').checked
      };
      let error;
      if (editingCaseId) {
        ({ error } = await supabase.from('cases').update(data).eq('id', editingCaseId));
      } else {
        ({ error } = await supabase.from('cases').insert([data]));
      }
      if (error) alert(error.message);
      else {
        document.getElementById('caseModal').style.display = 'none';
        await loadCases();
      }
    }

    async function deleteCase(id) {
      if (!confirm('Удалить дело?')) return;
      const { error } = await supabase.from('cases').delete().eq('id', id);
      if (error) alert(error.message);
      else {
        document.getElementById('caseModal').style.display = 'none';
        await loadCases();
      }
    }

    document.getElementById('addCaseBtn').addEventListener('click', () => openEditModal(null));

    // ---------- ANNOUNCEMENTS ----------
    async function loadAnnouncements() {
      const { data } = await supabase.from('announcements').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('announcementsList');
      if (!data || data.length === 0) {
        list.innerHTML = '<p>Нет объявлений</p>';
        return;
      }
      list.innerHTML = data.map(a => `
        <div class="card flex" style="justify-content: space-between; align-items: center;">
          <div>
            <strong>${a.title}</strong>
            <p style="color: var(--text-secondary);">${a.description || ''}</p>
            <small>${new Date(a.created_at).toLocaleString('ru-RU')}</small>
          </div>
          <div>
            ${a.file_url ? `<a href="${a.file_url}" target="_blank" class="btn secondary">📄 PDF</a>` : ''}
            ${currentUser ? `<button class="danger" onclick="deleteAnnouncement('${a.id}')">Удалить</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Удалить объявление?')) return;
      await supabase.from('announcements').delete().eq('id', id);
      loadAnnouncements();
    }

    document.getElementById('addAnnouncementBtn').addEventListener('click', async () => {
      const modal = document.getElementById('announcementModal');
      modal.style.display = 'block';
      modal.innerHTML = `
        <h2>Новое объявление</h2>
        <label>Название</label><input id="annTitle">
        <label>Описание</label><textarea id="annDesc"></textarea>
        <label>PDF файл</label><input type="file" id="annFile" accept=".pdf">
        <div class="flex" style="margin-top:12px; justify-content: flex-end;">
          <button class="secondary" onclick="document.getElementById('announcementModal').style.display='none'">Отмена</button>
          <button onclick="uploadAnnouncement()">Загрузить</button>
        </div>
      `;
    });

    async function uploadAnnouncement() {
      const title = document.getElementById('annTitle').value;
      const desc = document.getElementById('annDesc').value;
      const fileInput = document.getElementById('annFile');
      const file = fileInput.files[0];
      if (!title) { alert('Введите название'); return; }
      let fileUrl = null;
      if (file) {
        const fileName = `${Date.now()}_${file.name}`;
        const { data, error } = await supabase.storage.from('announcements').upload(fileName, file);
        if (error) { alert('Ошибка загрузки файла: ' + error.message); return; }
        const { data: publicUrlData } = supabase.storage.from('announcements').getPublicUrl(fileName);
        fileUrl = publicUrlData.publicUrl;
      }
      await supabase.from('announcements').insert([{ title, description: desc, file_url: fileUrl }]);
      document.getElementById('announcementModal').style.display = 'none';
      loadAnnouncements();
    }

    // ---------- TABS ----------
    document.getElementById('mainTabs').addEventListener('click', (e) => {
      if (e.target.classList.contains('tab')) {
        const tab = e.target.dataset.tab;
        activeTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById('tabCases').style.display = tab === 'cases' ? 'block' : 'none';
        document.getElementById('tabArchive').style.display = tab === 'archive' ? 'block' : 'none';
        document.getElementById('tabAnnouncements').style.display = tab === 'announcements' ? 'block' : 'none';
        if (tab === 'cases' || tab === 'archive') loadCases();
        if (tab === 'announcements') loadAnnouncements();
      }
    });

    // ---------- FILTERS ----------
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterMeasure').addEventListener('change', applyFilters);
    document.getElementById('filterUrgency').addEventListener('change', applyFilters);
    document.getElementById('archiveSearchInput').addEventListener('input', applyFilters);
    document.getElementById('clearFilters').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterMeasure').value = '';
      document.getElementById('filterUrgency').value = '';
      applyFilters();
    });

    // ---------- THEME ----------
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    });

    // ---------- REFRESH ----------
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadCases();
    });

    // ---------- INIT ----------
    checkUser();
  </script>
</body>
</html>
